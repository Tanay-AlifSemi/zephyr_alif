CONFIG_DEBUG=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG_PRINTK=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_KERNEL_LOG_LEVEL_ERR=y

#FATFS
CONFIG_FS_SAMPLE_CREATE_SOME_ENTRIES=y
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=512
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_LOG_LEVEL_DBG=y

# SD/MMC/SDHC/disk/regulator — full DBG (CMD traces, clock, voltage, dumps)
CONFIG_SD_LOG_LEVEL_DBG=y
CONFIG_SDHC_LOG_LEVEL_DBG=y
CONFIG_MMC_LOG_LEVEL_DBG=y
CONFIG_DISK_LOG_LEVEL_DBG=y
CONFIG_REGULATOR_LOG_LEVEL_DBG=y
CONFIG_GPIO_LOG_LEVEL_DBG=y

#SDHC DWC
CONFIG_SDHC_RSP_136_HAS_CRC=y
CONFIG_SDHC_DWC=y
CONFIG_SDHC_DWC_ADMA=y
